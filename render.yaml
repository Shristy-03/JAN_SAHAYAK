databases:
  - name: jan-sahayak-db
    databaseName: jan_sahayak
    user: jan_sahayak
    plan: 0.1c-256mb

services:
  - type: web
    name: jan-sahayak
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --access-logfile - --error-logfile -
    healthCheckPath: /healthz/
    autoDeployTrigger: commit
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: jan-sahayak-db
          property: connectionString
      - key: DATABASE_CONN_MAX_AGE
        value: "60"
      - key: USE_S3_MEDIA
        value: "True"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: SECURE_HSTS_PRELOAD
        value: "True"
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: EMAIL_TIMEOUT
        value: "10"
      - key: DEFAULT_FROM_EMAIL
        sync: false
  - type: cron
    name: jan-sahayak-overdue-notifications
    runtime: python
    plan: 0.1c-256mb
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py notify_overdue_complaints
    envVars:
      - key: SECRET_KEY
        fromService:
          name: jan-sahayak
          type: web
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: jan-sahayak-db
          property: connectionString
      - key: EMAIL_BACKEND
        fromService:
          name: jan-sahayak
          type: web
          envVarKey: EMAIL_BACKEND
      - key: EMAIL_HOST
        fromService:
          name: jan-sahayak
          type: web
          envVarKey: EMAIL_HOST
      - key: EMAIL_PORT
        fromService:
          name: jan-sahayak
          type: web
          envVarKey: EMAIL_PORT
      - key: EMAIL_HOST_USER
        fromService:
          name: jan-sahayak
          type: web
          envVarKey: EMAIL_HOST_USER
      - key: EMAIL_HOST_PASSWORD
        fromService:
          name: jan-sahayak
          type: web
          envVarKey: EMAIL_HOST_PASSWORD
      - key: EMAIL_USE_TLS
        fromService:
          name: jan-sahayak
          type: web
          envVarKey: EMAIL_USE_TLS
      - key: EMAIL_TIMEOUT
        value: "10"
      - key: DEFAULT_FROM_EMAIL
        fromService:
          name: jan-sahayak
          type: web
          envVarKey: DEFAULT_FROM_EMAIL
