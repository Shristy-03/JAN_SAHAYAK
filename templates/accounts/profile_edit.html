{% extends 'base.html' %}
{% block title %}Edit profile | JAN SAHAYAK{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7"><div class="card shadow-sm border-0"><div class="card-body p-4">
  <h1 class="h3 mb-3">Edit profile</h1><form method="post" novalidate>{% csrf_token %}
    {% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}</div>{% endfor %}
    <button class="btn btn-primary" type="submit">Save changes</button><a class="btn btn-outline-secondary" href="{% url 'accounts:profile' %}">Cancel</a>
  </form>
</div></div></div></div>
{% endblock %}
